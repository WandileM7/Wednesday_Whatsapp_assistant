services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wednesday:wednesday@db:5432/wednesday
      WAHA_URL: http://whatsapp-service:3000
      OLLAMA_HOST: http://ollama:11434
      VOICE_CACHE_DIR: /data/voices
    volumes:
      - voice-models:/data/voices
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      whatsapp-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  whatsapp-service:
    build: ./whatsapp-service
    ports:
      - "3000:3000"
    environment:
      WHATSAPP_HOOK_URL: http://backend:8000/whatsapp/webhook
      ENABLE_REAL_WHATSAPP: "true"
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - whatsapp-auth:/app/auth_info_baileys
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wednesday
      POSTGRES_PASSWORD: wednesday
      POSTGRES_DB: wednesday
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wednesday"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  whatsapp-auth:
  pgdata:
  ollama-models:
  voice-models:
