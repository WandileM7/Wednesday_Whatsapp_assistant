; Without this, Asterisk's runtime output goes to a console nobody is attached
; to and `docker compose logs asterisk` shows module loading and then silence —
; so a call that fails looks exactly like a call that never happened.
;
; Everything to a file the container can tail. This is a test rig; the whole
; point is being able to see what the call did.

[general]
dateformat = %F %T

[logfiles]
messages => notice,warning,error,verbose(3)
