; A narrow RTP range, because every port in it has to be published by the
; container runtime and forwarded to the LAN. Asterisk's default is
; 10000-20000, which is 10,000 UDP port mappings — enough to make Docker take
; minutes to start the container, or simply fall over.
;
; 100 ports is 25 or so concurrent calls. This is a single-user assistant.

[general]
rtpstart = 10000
rtpend = 10099
